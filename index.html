<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1fb5a5">
  <title>あるいてモンスター（仮）</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="game">
  <div id="map"></div>

  <header class="topbar">
    <span id="game-title" class="title"></span>
    <span id="mode-badge" class="badge hidden"></span>
    <button id="menu-btn" class="icon-btn" aria-label="メニュー">⚙️</button>
  </header>
  <div id="banner" class="banner hidden"></div>

  <footer class="bottombar">
    <div class="stat"><span class="mini-ball"></span><b id="ball-count">0</b></div>
    <button id="dex-btn" class="main-btn">📖 ずかん</button>
    <div class="stat">Lv <b id="level">1</b></div>
    <button id="recenter-btn" class="icon-btn" aria-label="現在地へ">🎯</button>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
