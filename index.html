<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1fb5a5">
  <title>あるいてモンスター（仮）</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="game">
  <div id="map"></div>

  <!-- 左上：モード表示 -->
  <span id="mode-badge" class="badge corner hidden"></span>

  <!-- 右上：コンパス -->
  <button id="compass-btn" class="compass" aria-label="方角">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <g id="compass-needle">
        <polygon points="20,5 25,20 15,20" fill="#ff5a4e"/>
        <polygon points="20,35 25,20 15,20" fill="#ffffff"/>
      </g>
    </svg>
  </button>

  <!-- 右上（コンパスの下）：スポット追加画面へ -->
  <a id="spot-add-btn" class="spot-add-btn" href="spots.html" aria-label="スポットを追加">
    <span class="gem"></span><span class="plus">＋</span>
  </a>

  <div id="banner" class="banner hidden"></div>

  <!-- 左下：自分のアイコン -->
  <button id="avatar-btn" class="avatar-btn" aria-label="プロフィール">
    <span class="avatar-face"><span class="cap"></span><span class="face"></span></span>
    <span class="avatar-lv">Lv<b id="level">1</b></span>
  </button>

  <!-- 下の真ん中：メインボタン -->
  <button id="main-btn" class="main-ball" aria-label="メニュー"><span></span></button>

  <!-- 右下：近くのキャラ -->
  <button id="nearby-btn" class="nearby" aria-label="近くにいるキャラ">
    <span id="nearby-grid" class="nearby-grid"></span>
    <span class="nearby-label">近くにいる</span>
  </button>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
